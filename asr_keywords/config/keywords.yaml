# 关键字（命令）配置
#
# 每个命令组包含：
#   command  : 识别成功后统一输出的标准命令文字
#   synonyms : 同义词 / 近义说法列表（ASR 识别到这些说法时，
#              会统一映射并输出 command）
#
# 匹配时除了精确包含，还会按字符相似度和拼音相似度（处理模糊音、
# 读错字、声调差异）进行模糊匹配，相似度阈值由节点参数 threshold 设置。
#
# 扩展方法：直接在下面新增命令组即可，例如以后增加机械臂命令。

commands:
  - command: 小车向前
    synonyms: [小车前进, 小车往前, 向前, 前进, 往前走, 往前行, 往前开, 一直向前, 直行]

  - command: 小车向后
    synonyms: [小车后退, 小车倒退, 小车倒车, 向后, 后退, 往后走, 往后退, 倒退, 倒车]

  - command: 小车左转
    synonyms: [小车左拐, 向左转, 往左拐, 往左, 左转, 左拐]

  - command: 小车右转
    synonyms: [小车右拐, 向右转, 往右拐, 往右, 右转, 右拐]

  - command: 小车停止
    synonyms: [小车停下, 小车停车, 小车刹车, 停止, 停下, 停下来, 停车, 刹车, 中止, 停]

  # 抓取/递送类命令（机械臂）
  # 近音、模糊音、声调差异、读错字（如“平果/苹国/拿过莱”）由节点的
  # 拼音相似度自动匹配，这里只列不同语序、近义说法和长短变体。
  - command: 把苹果拿过来
    synonyms: [苹果拿过来, 拿苹果过来, 把苹果拿来, 把苹果递过来, 把苹果递给我,
               把苹果给我, 给我拿苹果, 把苹果取过来, 把苹果抓过来, 把苹果夹过来,
               拿个苹果过来, 把那个苹果拿过来, 拿苹果]

  # ---- 夹爪（机械臂末端）命令 ----
  # 松开 = 按最大松开值（夹爪全开）；闭合 = 按张开约 1/3 的抓取闭合值。
  # 多音字（夹 jiā/jiá/gā、爪 zhuǎ/zhǎo）的误读、同音字误识别
  # （夹→家/加、爪→抓、合→河/和）、声调差异由节点拼音相似度自动处理，
  # 这里只列不同语序、近义说法和长短变体。
  - command: 夹爪松开
    synonyms: [夹爪张开, 夹爪打开, 夹爪放开, 夹爪松手,
               爪子松开, 爪子张开, 爪子打开,
               手松开, 手张开, 手打开,
               松开夹爪, 张开夹爪, 打开夹爪,
               松开手, 张开手,
               松开, 松手, 张开, 放开]

  - command: 夹爪闭合
    synonyms: [夹爪关闭, 夹爪合上, 夹爪夹紧, 夹爪夹住,
               爪子闭合, 爪子夹紧, 爪子抓住, 爪子抓紧,
               手闭合, 手抓住, 手抓紧, 手夹住,
               闭合夹爪, 关闭夹爪, 合上夹爪, 夹紧夹爪,
               抓住, 抓紧, 夹住, 夹紧]

  # ---- 机械臂整机命令 ----
  # 停止 = 立即取消机械臂一切在途运动（急停）；回家 = 6 关节回到 home 零位。
  # "机械臂"可以说成：机器臂、机械手、手臂、手、臂；多音字（臂 bei/bi、
  # 械 xiè 误读/误识别成 jiè 等）、同音字、声调差异由节点拼音相似度处理。
  # 注意：不要加裸"停止/停"——那会与"小车停止"冲突，停止臂必须带臂/手类修饰。
  - command: 机械臂停止
    synonyms: [机械臂停下, 机械臂停住, 机械臂暂停, 机械臂别动, 机械臂不动,
               机器臂停止, 机器臂停下, 机械手停止, 机械手停下, 机械手别动,
               手臂停止, 手臂停下, 手臂停住, 手臂别动,
               手停止, 手停下, 手停住, 手别动, 手不动,
               臂停止, 臂停下, 臂别动, 停臂, 停手,
               停止机械臂, 停下机械臂, 机械臂停止运动]

  - command: 机械臂回家
    synonyms: [机械臂归位, 机械臂回零, 机械臂回原点, 机械臂回位,
               机械臂复位, 机械臂回去, 机械臂收回来,
               机器臂回家, 机器臂归位, 机械手回家, 机械手归位,
               手臂回家, 手臂归位, 手臂回零,
               手回家, 手归位, 手回零, 手回原点,
               臂回家, 臂归位, 收臂回家, 收臂回位]

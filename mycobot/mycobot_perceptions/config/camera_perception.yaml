/**:
  ros__parameters:
    # ---- Input topics & frame ----
    # These are the topic names requested by the user. If you run the Gazebo
    # simulation (perception_test.launch.py with use_gazebo:=true) the simulated
    # camera topics are remapped onto these names.
    point_cloud_topic: "/camera/depth_registered/points"
    rgb_image_topic: "/camera/color/image_raw"
    target_frame: "base_link"

    # ---- Processing ----
    # Run the (expensive) pipeline at a low rate to keep CPU usage reasonable.
    processing_rate: 0.5
    publish_processed_cloud: true
    publish_objects_cloud: true
    publish_support_plane_cloud: true
    publish_object_markers: true

    # ---- Crop box (in the target frame) ----
    enable_cropping: true
    crop_min_x: -2.0
    crop_max_x: 1.5
    crop_min_y: -2.0
    crop_max_y: 2.0
    crop_min_z: -2.0
    crop_max_z: 2.0

    # ---- Plane & object segmentation ----
    max_iterations: 100
    distance_threshold: 0.01
    z_tolerance: 0.03
    angle_tolerance: 0.9990482216   # cos(2.5 deg)
    plane_segmentation_threshold: 0.001
    min_cluster_size: 150
    max_cluster_size: 1000000
    cluster_tolerance: 0.02
    normal_estimation_k: 30
    w_inliers: 1.0
    w_size: 1.0
    w_distance: 1.0
    w_orientation: 1.0
    max_plane_segmentation_iterations: 1000
    plane_segmentation_distance_threshold: 0.01

    # ---- Support surface ----
    support_surface_name: "support_surface"
    min_surface_thickness: 0.0001

    # ---- Normal / curvature / RSD ----
    k_neighbors: 30
    max_plane_error: 0.01
    max_iterations_normals: 100
    min_boundary_neighbors: 10
    rsd_radius: 0.02

    # ---- Cluster extraction ----
    nearest_neighbors: 30
    smoothness_threshold: 20.0       # degrees
    curvature_threshold: 0.2

    # ---- Object segmentation ----
    num_iterations: 5
    inlier_threshold: 85
    hough_radius_bins: 50
    hough_center_bins: 50
    ransac_distance_threshold: 0.001
    ransac_max_iterations: 1000
    circle_min_cluster_size: 20
    circle_max_clusters: 2
    circle_height_tolerance: 0.025
    circle_curvature_threshold: 0.0015
    circle_radius_tolerance: 0.020
    circle_normal_angle_threshold: 0.2
    circle_cluster_tolerance: 0.025
    line_min_cluster_size: 20
    line_max_clusters: 1
    line_curvature_threshold: 0.0011
    line_cluster_tolerance: 0.025
    line_rho_threshold: 0.01
    line_theta_threshold: 0.1

    # ---- Legacy shape fitting (fallback used by fitShapeToCluster) ----
    shape_fitting_max_iterations: 1000
    shape_fitting_distance_threshold: 0.01
    shape_fitting_min_radius: 0.01
    shape_fitting_max_radius: 0.1
    shape_fitting_normal_distance_weight: 0.1
    shape_fitting_normal_search_radius: 0.05

    # ---- Target object description ----
    # No service request needed: describe the object you want to pick here.
    # Valid shapes: "cylinder", "box".
    # For a cylinder: [height, radius]
    # For a box:      [x, y, z]
    target_shape: "cylinder"
    target_dimensions: [0.06, 0.0125]

    # ---- Debug ----
    output_directory: "/tmp/"
    debug_pcd_filename: "perception_debug_cloud.pcd"
    save_debug_pcd: false

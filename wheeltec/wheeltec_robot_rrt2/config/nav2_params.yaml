amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.9
    alpha2: 0.1
    alpha3: 0.05
    alpha4: 0.01
    alpha5: 0.04
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom_combined"
    pf_err: 0.02
    pf_z: 0.85
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 2
    robot_model_type: "differential"
    save_pose_rate: 0.5
    sigma_hit: 0.02
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.06
    update_min_d: 0.025
    z_hit: 0.7
    z_max: 0.001
    z_rand: 0.059
    z_short: 0.24

    # Initial Pose
    set_initial_pose: True
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom_combined
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    # 下面的占位值由 nav2_navigation_launch.py 的 RewrittenYaml 用 launch 参数
    # default_bt_xml_filename（指向 wheeltec_rrt 的 1Hz 重规划行为树）替换
    default_nav_to_pose_bt_xml: "REPLACED_BY_RRT_LAUNCH"
    # Jazzy 的 bt_navigator 会自动注册全部内置 BT 插件库；
    # 这里再显式给 plugin_lib_names 会导致 "ID [ComputePathToPose] already registered"
    # 崩溃，因此不再设置该参数

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001   # 差速小车 vx 正负都用，0.001 微阈值
    min_y_velocity_threshold: 0.0     # 差速小车无 vy，置零
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5             # 放宽到 0.5m — MPPI 前瞻 2m 内轨迹可能扫过 inflation 边缘, 不应因此判失败
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 探索时车速低、常需原地调整，0.5m/10s 会频繁误判"未取得进展"并中止目标
      required_movement_radius: 0.15
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.3
      stateful: True
      
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40                     # 每条采样轨迹的时间步数
      model_dt: 0.05                      # 采样时间间隔(s) — 总前瞻时长 = 40 × 0.05 = 2.0s
      batch_size: 1200                    # 增加到 1200 条，提高窄通道采样命中率
      iteration_count: 1                  # MPPI 外层迭代次数；实测 1 就够，多迭代收益不大
      temperature: 0.2                    # 降低 → 更偏向最优轨迹（原 0.3 太平均）
      gamma: 0.015                        # 平滑/低能耗权衡；一般无需改动
      motion_model: "DiffDrive"           # 差速驱动运动模型（不允许横向平移）
      vx_max: 0.15                        # 保守限速，让 MPPI 轨迹更短更准
      vx_min: -0.05                         # 禁后退（项目约束）
      vy_max: 0.0                         # 横向速度 — 差速小车不允许横向平移
      wz_max: 0.1
      wz_std: 0.4                         # wz 采样标准差(rad/s) — 控制输入扰动幅度
      vx_std: 0.15                        # vx 采样标准差 — 略收敛，减少"飞出去"的轨迹
      vy_std: 0.0                         # DiffDrive 下 vy 无自由度
      visualize: false                    # 调试时开 true 可在 RViz 看到采样轨迹，正式运行关
      regenerate_noises: false            # 每帧重新生成噪声分布；false 减少计算抖动
      retry_attempt_limit: 3              # 失败后多试几次

      critics: ["ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "ConstraintCritic"]

      ObstaclesCritic:
        plugin: "mppi::critics::ObstaclesCritic"
        cost_scaling_factor: 2.0          # 窄通道：惩罚大幅降低（原 10.0 把 inflation 边缘轨迹全打死）
        inflation_dist: 0.21              # 贴合车体内切圆半径，只对真正危险的轨迹打高代价
      GoalCritic:
        plugin: "mppi::critics::GoalCritic"
        cost_scaling_factor: 5.0          # 趋向目标点的代价权重
        threshold: 0.20                    # 进入此距离后逐步降低 GoalCritic 权重（让 PathFollowCritic 主导）
      GoalAngleCritic:
        plugin: "mppi::critics::GoalAngleCritic"
        cost_scaling_factor: 3.0          # 到达时朝向对齐目标的权重
        threshold: 0.20                    # 距离目标小于此值时才激活
      PathFollowCritic:
        plugin: "mppi::critics::PathFollowCritic"
        cost_scaling_factor: 6.0          # 沿路径向目标推进
        threshold: 0.40                    # 偏离路径超过此距离时代价快速增长（原 0.30 太严）
      PathAngleCritic:
        plugin: "mppi::critics::PathAngleCritic"
        cost_scaling_factor: 4.0          # 航向与路径切线对齐
      PreferForwardCritic:
        plugin: "mppi::critics::PreferForwardCritic"
        cost_scaling_factor: 10.0         # 优先前进方向，惩罚后退
        penalty: 10.0                     # 后退轨迹的额外惩罚
      ConstraintCritic:
        plugin: "mppi::critics::ConstraintCritic"
        cost_scaling_factor: 5.0          # 运动约束越界惩罚权重
      
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 与 global_costmap 一致的真实 footprint
      footprint: "[ [0.24, 0.21], [0.24, -0.21], [-0.24, -0.21], [-0.24, 0.21] ]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 窄通道通行：让 FREE（cost=0）边界紧贴车体轮廓
        # inscribed_radius=0.21m (footprint内切), inflation_radius=0.25m → 衰减区仅 1 个 cell(0.05m)宽
        # cell d=0.275m(0.55m通道中心) 起 cost=0, 完美覆盖 0.55m 以上通道
        inflation_radius: 0.25
        cost_scaling_factor: 8.0   # 更陡衰减: 衰减区 cell cost 快速降到 0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # 真实车体矩形轮廓（senior_4wd: 半长 0.24m / 半宽 0.21m），Nav2 官方推荐用 footprint 而非圆形 robot_radius
      # 内切圆半径自动计算为 0.21m（=半宽），比 robot_radius=0.20 更安全准确
      footprint: "[ [0.24, 0.21], [0.24, -0.21], [-0.24, -0.21], [-0.24, 0.21] ]"
      footprint_padding: 0.01
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 与 local_costmap 保持一致：衰减区仅 1 个 cell 宽
        inflation_radius: 0.25
        cost_scaling_factor: 8.0
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: False

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.2                      # tolerance for planning if unable to reach exact pose, in meters
      downsample_costmap: false           # whether or not to downsample the map
      downsampling_factor: 1              # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: false                # allow traveling in unknown space
      max_iterations: 1000000             # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000    # maximum number of iterations to attempt to reach goal once in tolerance
      max_planning_time: 3.5              # max time in s for planner to plan, smooth
      cost_travel_multiplier: 2.0         # Cost multiplier to steer away from high cost areas (center of aisles). 2.0 = reasonable tradeoff, 1.0 = fastest, 0.0 = naive binary A*
      use_final_approach_orientation: false  # false: 终点朝向跟随接近方向（差速车到达后自行原地转向）；true: 强制对齐目标朝向
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1e-10

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom_combined
    local_frame: odom_combined
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.3

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

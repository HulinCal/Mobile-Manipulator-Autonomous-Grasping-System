amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.5
    alpha2: 0.1
    alpha3: 0.05
    alpha4: 0.01
    alpha5: 0.04
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 6.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field_prob"
    max_beams: 120
    max_particles: 2000
    min_particles: 800
    odom_frame_id: "odom_combined"
    pf_err: 0.02
    pf_z: 0.85
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 2
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.02
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.06
    update_min_d: 0.025
    z_hit: 0.7
    z_max: 0.001
    z_rand: 0.059
    z_short: 0.24

    # Initial Pose
    set_initial_pose: True
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom_combined
    bt_loop_duration: 10
    default_server_timeout: 20
    # AMCL 的重定位服务由独立的 lifecycle manager 启动，给足等待时间避免激活竞态
    wait_for_service_timeout: 10000
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    # 注册的 Navigator：前两个为 nav2 默认，第三个为初始化定位
    navigators: ["navigate_to_pose", "navigate_through_poses", "initialize_localization"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 初始化定位：全局重定位 + 旋转 360° + 前进 0.5m
    initialize_localization:
      plugin: "wheeltec_nav2::InitializeLocalizationNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.6
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -0.2
      min_vel_y: 0.0
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.2
      min_speed_theta: 0.0
      acc_lim_x: 0.25
      acc_lim_y: 0.0
      acc_lim_theta: 0.5
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.5
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 30
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 1.0
      PathAlign.scale: 20.0
      GoalAlign.scale: 10.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 20.0
      GoalDist.scale: 10.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 2.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 碰撞轮廓 0.52m×0.44m（实测车体 0.50m×0.42m + 1cm padding）
      #robot_radius: 0.20
      footprint: "[[-0.26, -0.22], [-0.26, 0.22], [0.26, 0.22], [0.26, -0.22]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.52×0.44 轮廓外接圆半径 0.3406m(+padding 0.01)；必须 >= 该值
        inflation_radius: 0.45
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.15
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05  

      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # 碰撞轮廓 0.52m×0.44m（实测车体 0.50m×0.42m + 1cm padding）
      #robot_radius: 0.20   # 使用 footprint 而非圆形近似，注释掉避免歧义
      resolution: 0.05
      footprint: "[[-0.26, -0.22], [-0.26, 0.22], [0.26, 0.22], [0.26, -0.22]]"
      footprint_padding: 0.01
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # ── costmap 根层级参数（StaticLayer/ObstacleLayer 共享）──
      track_unknown_space: true    # false=未知视为 FREE_SPACE(0)，让 NavFn 直接穿过
      unknown_cost_value: 255       # 地图中 unknown 的原始值（默认 255）
      lethal_cost_threshold: 100   # occupancy ≥ 100 视为 lethal obstacle
      trinary_costmap: true         # 三值模式 (FREE/LETHAL/UNKNOWN)
      use_maximum: false
      # ── 子 layer ──
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.15
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        # 全局需要足够宽的代价梯度，Smac 才会把路径推向通道中央
        inflation_radius: 0.50
        inflate_unknown: True        # 把未知当成致命障碍膨胀
        inflate_around_unknown: True
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "turtlebot3_world.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.1                    # 目标点容差(m)
      allow_unknown: false              # 禁止穿越未知区域（配合 costmap track_unknown_space）
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0            # 单次规划最长耗时(s)
      downsample_costmap: false         # 降采样代价地图（大地图可开，提速但精度下降）
      downsampling_factor: 1            # 降采样倍数
      cost_travel_multiplier: 2.0       # 代价权重，越大越倾向绕开高代价格
      use_final_approach_orientation: false  # 终点朝向是否取接近方向（差速车建议 false）
      terminal_checking_interval: 5000  # 接近终点的碰撞检查间隔（迭代次数）

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom_combined
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.3

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# 定位异常监控：协方差发散或激光与地图长期不匹配时，自动触发初始化定位
localization_monitor:
  ros__parameters:
    use_sim_time: False
    initialize_action: "/initialize_localization"
    map_topic: "/map"
    amcl_pose_topic: "/amcl_pose"
    scan_topic: "/scan"
    odom_topic: "/odom_combined"
    base_frame: "base_footprint"
    # 定位发散判定：AMCL 位姿标准差阈值
    std_xy_threshold: 0.30
    std_yaw_threshold: 0.20
    # 绑架判定：只统计地图有信息且雷达有回波的光束，要求大范围、多方向同时失配
    scan_mismatch_threshold: 0.60
    scan_match_tolerance: 0.50
    scan_check_max_beams: 80
    scan_check_min_beams: 40
    scan_check_min_mismatch_beams: 25
    scan_min_mismatch_sectors: 5
    # 启动静止期实测的失配基线；实际阈值 = max(scan_mismatch_threshold, 基线 + margin)
    scan_baseline_margin: 0.20
    scan_check_max_range: 6.0
    occupied_threshold: 65
    # 重定位后需产生该位移才恢复协方差判定，避免静止时协方差无法收敛导致误报
    cov_suppress_move_dist: 0.05
    # 触发策略
    anomaly_sustain_time: 3.0
    startup_grace_period: 15.0
    recovery_cooldown: 60.0
    recovery_timeout: 120.0
    max_consecutive_recoveries: 3
    failure_hold_time: 120.0
    settle_after_success: 5.0
    require_stationary: True
    stationary_linear_threshold: 0.02
    stationary_angular_threshold: 0.05
    odom_timeout: 1.0

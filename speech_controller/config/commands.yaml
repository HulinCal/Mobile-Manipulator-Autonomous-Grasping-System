# 文本命令 -> 底盘 Twist 速度 / 夹爪位置 配置
#
# commands: 底盘运动命令
#   每个命令下指定 linear（线速度，m/s）与 angular（角速度，rad/s）
#   的 x / y / z 三个分量，缺省未写的分量按 0 处理。
#
# gripper_commands: 机械臂夹爪命令
#   命令文字 -> 夹爪关节目标位置（rad），通过
#   control_msgs/GripperCommand action (/gripper_action_controller/gripper_cmd)
#   下发，与 pick_place 抓取流程使用同一套已验证接口。
#   夹爪 URDF 关节范围 [-0.7, 0.15] rad：
#     0.15  = 最大松开（pymycobot value 100，夹爪全开）
#     -0.42 = 闭合到张开约 1/3（pymycobot value 33，抓取苹果的闭合值）
#   命令文字必须与 asr_keywords 的 keywords.yaml 中标准命令一致。
#
# service_commands: 机械臂整机命令
#   命令文字 -> std_srvs/Trigger 服务名（grasp_node 提供，已随整车栈启动）：
#     机械臂停止 -> /pick_place/arm_stop  急停（取消在途运动+固件 stop）
#     机械臂回家 -> /pick_place/arm_home  6 关节回到 home 零位
#
# 修改本文件即可调整各命令对应的速度/夹爪位置，无需改动代码。
# 改完源码配置需重新 colcon build；也可通过 commands_file 参数
# 指向外部配置文件（无需编译）。
#
# 符号约定（ROS 标准）：
#   linear.x  正=前进，负=后退
#   angular.z 正=逆时针左转，负=顺时针右转

commands:
  小车向前:
    linear:  {x: 0.05, y: 0.0, z: 0.0}
    angular: {x: 0.0, y: 0.0, z: 0.0}

  小车向后:
    linear:  {x: -0.05, y: 0.0, z: 0.0}
    angular: {x: 0.0, y: 0.0, z: 0.0}

  小车左转:
    linear:  {x: 0.0, y: 0.0, z: 0.0}
    angular: {x: 0.0, y: 0.0, z: 0.1}

  小车右转:
    linear:  {x: 0.0, y: 0.0, z: 0.0}
    angular: {x: 0.0, y: 0.0, z: -0.1}

  小车停止:
    linear:  {x: 0.0, y: 0.0, z: 0.0}
    angular: {x: 0.0, y: 0.0, z: 0.0}

gripper_commands:
  夹爪松开: 0.15
  夹爪闭合: -0.42

service_commands:
  机械臂停止: /pick_place/arm_stop
  机械臂回家: /pick_place/arm_home
